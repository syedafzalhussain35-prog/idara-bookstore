{% extends 'store/base.html' %}

{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 70vh;">
    <div class="col-md-5 col-lg-4">
        <div class="card shadow-lg border-0 rounded-3">
            <div class="card-header text-white text-center py-4" style="background-color: var(--primary-magenta);">
                <h3 class="mb-0 fw-bold">Welcome Back</h3>
                <small>Login to access your account</small>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="post">
                    {% csrf_token %}
                    
                    {% for field in form %}
                    <div class="mb-3">
                        <label class="form-label fw-bold text-muted">{{ field.label }}</label>
                        <div class="input-group">
                            {{ field }} 
                        </div>
                        {% if field.errors %}
                            <small class="text-danger">{{ field.errors.0 }}</small>
                        {% endif %}
                    </div>
                    {% endfor %}

                    <button type="submit" class="btn w-100 py-2 mt-3 fw-bold shadow-sm" 
                            style="background-color: var(--primary-magenta); color: white;">
                        Login
                    </button>
                </form>
            </div>
            <div class="card-footer text-center bg-light py-3">
                <p class="mb-0 small">Don't have an account? 
                    <a href="{% url 'signup' %}" class="fw-bold" style="color: var(--primary-magenta);">Sign Up Here</a>
                </p>
            </div>
        </div>
    </div>
</div>

<style>
    /* Style the Django form inputs */
    input[type="text"], input[type="password"] {
        width: 100%;
        padding: 10px;
        border: 1px solid #ced4da;
        border-radius: 5px;
    }
    input:focus {
        outline: none;
        border-color: var(--primary-magenta);
        box-shadow: 0 0 5px rgba(189, 24, 89, 0.3);
    }
</style>
{% endblock %}
