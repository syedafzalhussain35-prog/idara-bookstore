services:
  - type: web
    name: idara-bookstore
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate && python manage.py ensure_superuser
    startCommand: gunicorn idara_project.wsgi:application --worker-class gthread --workers 2 --threads 2 --timeout 120 --keep-alive 5
    autoDeploy: true
