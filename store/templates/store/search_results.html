{% extends 'store/base.html' %}

{% block title %}Search Results{% endblock %}

{% block content %}
<div class="container py-5">

    <h4 class="mb-4">
        Search results for “{{ query }}”
    </h4>

    {% if books %}
        <div class="row g-3">
            {% for book in books %}
                {% include 'store/partials/book_card.html' %}
            {% endfor %}
        </div>
    {% else %}
        <p class="text-muted">No books found.</p>
    {% endif %}

</div>

<style>
@media (max-width: 768px) {
    h4.mb-4 {
        font-size: 1.1rem;
    }
}
</style>
{% endblock %}
