<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Order Confirmed</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light text-center py-5">
    
    <div class="container">
        <div class="card shadow p-5 mx-auto" style="max-width: 600px;">
            <h1 class="text-success display-4">✔ Success!</h1>
            <p class="lead mt-3">Thank you, <strong>{{ order.full_name }}</strong>.</p>
            <p>Your order <strong>#{{ order.id }}</strong> has been placed successfully.</p>
            <p class="text-muted">We will ship it to: {{ order.city }}</p>
            
            <a href="/" class="btn btn-primary mt-4">Return to Shop</a>
        </div>
    </div>

</body>
</html>
