{% extends "admin/base_site.html" %}

{% block content %}
<div class="content">
    <h1>{{ title }}</h1>
    {% if bulk_import_help %}
        <p>{{ bulk_import_help }}</p>
    {% endif %}
    {% if bulk_import_columns %}
        <p>Expected columns: <strong>{{ bulk_import_columns|join:", " }}</strong></p>
    {% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <fieldset class="module aligned">
            {{ form.as_p }}
        </fieldset>
        <div class="submit-row">
            <input type="submit" class="default" value="Import">
            <a href="{{ changelist_url }}" class="button">Back</a>
        </div>
    </form>
</div>
{% endblock %}
